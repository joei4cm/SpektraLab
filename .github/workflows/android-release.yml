# Publish the Android debug APK as a GitHub Release asset.
#
# Builds exactly like .github/workflows/android.yml (Linux runner, no GPU/phone,
# so it does not run the app) and then attaches app-debug.apk to a release.
#
# How to cut a release:
#   - push a tag matching android-v* or v*, e.g.
#         git tag android-v0.1.1 && git push origin android-v0.1.1
#   - or run this workflow manually (Actions -> Android Release -> Run workflow)
#     and give it a tag name; the tag is created at the chosen commit.
#
# Uses the Android SDK preinstalled on ubuntu-latest. Do NOT use
# android-actions/setup-android's default packages: they still ask for the
# obsolete `tools` package and fail with "Failed to find package 'tools'"
# (that's why android-v0.1.0 never got an APK).

name: Android Release

on:
  push:
    tags:
      - 'android-v*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. android-v0.1.1)'
        required: true
        default: 'android-v0.1.1'
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages (NDK, platform, CMake)
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          SM=$(ls -d "$SDKROOT"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdkmanager=$SM"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" "platform-tools" "platforms;android-34" \
            "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: glslangValidator (SPIR-V compiler)
        run: sudo apt-get update && sudo apt-get install -y glslang-tools

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ github.event.inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Name the APK after the tag
        id: apk
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          out="FilmPrintLab-${tag}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$out"
          sha=$(sha256sum "$out" | cut -d' ' -f1)
          size=$(du -h "$out" | cut -f1)
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"

      - name: Create or update the release and upload the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          apk="${{ steps.apk.outputs.file }}"
          prerelease_flag=""
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            prerelease_flag="--prerelease"
          fi
          notes="Unofficial Android **debug** build of the FilmPrint Lab MVP (the SpektraLab C++/Vulkan film/print engine).

          - APK: \`${apk}\`
          - SHA-256: \`${{ steps.apk.outputs.sha256 }}\`
          - Size: ${{ steps.apk.outputs.size }}
          - ABIs: arm64-v8a, x86_64 · requires a Vulkan 1.0 device/emulator

          Install with \`adb install -r ${apk}\`. Debug-signed; not for production.
          See android/README.md for build details, limits and credits (GPL-3.0 / CC BY-SA 4.0)."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" \
              --title "FilmPrint Lab $tag" \
              --notes "$notes" \
              --target "$GITHUB_SHA" \
              $prerelease_flag
          fi

      - name: Also upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error
